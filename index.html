</style>

<script>

/* =====================================================
   CANVAS
===================================================== */

const WIDTH = 1080;
const HEIGHT = 1920;

const TOP_SPACE = 50;
const SAFE_BOTTOM = 150;

const ANIMAL_SIZE = 375;
const HALF_WIDTH = 200;

const LEFT_AREA = 702;


/* =====================================================
   POSITIONING
===================================================== */

const ANIMAL_X =
    (LEFT_AREA - ANIMAL_SIZE) / 2;

const RIGHT_X =
    ANIMAL_X + 200;

const ANIMATION_HEIGHT =
    HEIGHT -
    TOP_SPACE -
    SAFE_BOTTOM;

const ROW_HEIGHT =
    ANIMATION_HEIGHT / 4;

const ANIMAL_Y =
    (ROW_HEIGHT - ANIMAL_SIZE) / 2;


const ROWS = {

    A: TOP_SPACE,

    B:
        TOP_SPACE +
        ROW_HEIGHT,

    C:
        TOP_SPACE +
        ROW_HEIGHT * 2,

    D:
        TOP_SPACE +
        ROW_HEIGHT * 3

};


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "previewCanvas"
    );

const ctx =
    canvas.getContext("2d");


/* =====================================================
   IMAGES
===================================================== */

const animals = {

    A: null,
    B: null,
    C: null,
    D: null

};

let backgroundImage = null;


/* =====================================================
   AUDIO
===================================================== */

let audioMoving = null;
let audioWrong = null;
let audioCorrect = null;

let movingAudioURL = null;
let wrongAudioURL = null;
let correctAudioURL = null;


/* =====================================================
   SETTINGS
===================================================== */

let backgroundOpacity = 0.35;

let moveDuration = 3;

let matchDuration = 1;

/*
    NEW:
    Extra delay after correct match.
*/
const CORRECT_PAUSE = 1;


/* =====================================================
   SEQUENCE
===================================================== */

let sequence = [];


/* =====================================================
   PLAYBACK
===================================================== */

let isPlaying = false;

let previewPaused = 0;

let previewAnimation = null;

let lastAudioEventKey = "";


/* =====================================================
   WEBM
===================================================== */

let generatedBlob = null;

let generatedUrl = null;

let audioContext = null;

let audioDestination = null;

let movingSource = null;
let wrongSource = null;
let correctSource = null;


/* =====================================================
   DOM
===================================================== */

const status =
    document.getElementById("status");

const progressBar =
    document.getElementById(
        "progressBar"
    );

const currentTime =
    document.getElementById(
        "currentTime"
    );


/* =====================================================
   FILE READER
===================================================== */

function readFile(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                () => reject(
                    new Error(
                        "File could not be read."
                    )
                );

            reader.readAsDataURL(file);

        }
    );

}


/* =====================================================
   IMAGE LOADER
===================================================== */

function loadImage(src) {

    return new Promise(
        (resolve, reject) => {

            const img =
                new Image();

            img.onload =
                () => resolve(img);

            img.onerror =
                () => reject(
                    new Error(
                        "Image could not be loaded."
                    )
                );

            img.src = src;

        }
    );

}


/* =====================================================
   ANIMAL LOADING
===================================================== */

async function loadAnimal(
    letter,
    file
) {

    if (!file) {
        return;
    }

    try {

        const src =
            await readFile(file);

        animals[letter] =
            await loadImage(src);

        drawStaticCanvas();

        status.textContent =
            letter + " uploaded";

    }
    catch (error) {

        console.error(error);

        alert(
            "Unable to load " +
            letter +
            " image."
        );

    }

}


document
.getElementById("animalA")
.addEventListener(
    "change",
    function () {

        loadAnimal(
            "A",
            this.files[0]
        );

    }
);


document
.getElementById("animalB")
.addEventListener(
    "change",
    function () {

        loadAnimal(
            "B",
            this.files[0]
        );

    }
);


document
.getElementById("animalC")
.addEventListener(
    "change",
    function () {

        loadAnimal(
            "C",
            this.files[0]
        );

    }
);


document
.getElementById("animalD")
.addEventListener(
    "change",
    function () {

        loadAnimal(
            "D",
            this.files[0]
        );

    }
);


/* =====================================================
   BACKGROUND
===================================================== */

document
.getElementById("backgroundInput")
.addEventListener(
    "change",
    async function () {

        if (!this.files[0]) {
            return;
        }

        try {

            const src =
                await readFile(
                    this.files[0]
                );

            backgroundImage =
                await loadImage(src);

            drawStaticCanvas();

        }
        catch (error) {

            console.error(error);

        }

    }
);


/* =====================================================
   OPACITY
===================================================== */

document
.getElementById("bgOpacity")
.addEventListener(
    "input",
    function () {

        backgroundOpacity =
            Number(this.value) / 100;

        document
        .getElementById(
            "opacityValue"
        )
        .textContent =
            this.value + "%";

        drawStaticCanvas();

    }
);


/* =====================================================
   AUDIO
===================================================== */

function loadAudioFile(
    file,
    type
) {

    if (!file) {
        return;
    }

    const url =
        URL.createObjectURL(file);


    if (type === "moving") {

        if (movingAudioURL) {

            URL.revokeObjectURL(
                movingAudioURL
            );

        }

        movingAudioURL = url;

        audioMoving =
            new Audio(url);

        audioMoving.preload =
            "auto";

        document
        .getElementById(
            "movingStatus"
        )
        .textContent =
            "✓ " + file.name;

    }


    if (type === "wrong") {

        if (wrongAudioURL) {

            URL.revokeObjectURL(
                wrongAudioURL
            );

        }

        wrongAudioURL = url;

        audioWrong =
            new Audio(url);

        audioWrong.preload =
            "auto";

        document
        .getElementById(
            "wrongStatus"
        )
        .textContent =
            "✓ " + file.name;

    }


    if (type === "correct") {

        if (correctAudioURL) {

            URL.revokeObjectURL(
                correctAudioURL
            );

        }

        correctAudioURL = url;

        audioCorrect =
            new Audio(url);

        audioCorrect.preload =
            "auto";

        document
        .getElementById(
            "correctStatus"
        )
        .textContent =
            "✓ " + file.name;

    }

}


document
.getElementById("audioMoving")
.addEventListener(
    "change",
    function () {

        loadAudioFile(
            this.files[0],
            "moving"
        );

    }
);


document
.getElementById("audioWrong")
.addEventListener(
    "change",
    function () {

        loadAudioFile(
            this.files[0],
            "wrong"
        );

    }
);


document
.getElementById("audioCorrect")
.addEventListener(
    "change",
    function () {

        loadAudioFile(
            this.files[0],
            "correct"
        );

    }
);


/* =====================================================
   AUDIO PLAY
===================================================== */

function playAudio(audio) {

    if (!audio) {
        return;
    }

    try {

        audio.pause();

        audio.currentTime = 0;

        const promise =
            audio.play();

        if (
            promise &&
            typeof promise.catch === "function"
        ) {

            promise.catch(
                () => {}
            );

        }

    }
    catch (error) {}

}


/* =====================================================
   STOP AUDIO
===================================================== */

function stopAllPreviewAudio() {

    [
        audioMoving,
        audioWrong,
        audioCorrect
    ].forEach(
        audio => {

            if (!audio) {
                return;
            }

            try {

                audio.pause();

                audio.currentTime = 0;

            }
            catch (error) {}

        }
    );

}


/* =====================================================
   SEQUENCE
===================================================== */

function createSequence() {

    sequence = [

        {
            animal: "D",

            targets: [
                "A",
                "B",
                "C",
                "D"
            ]

        },

        {
            animal: "C",

            targets: [
                "A",
                "B",
                "C"
            ]

        },

        {
            animal: "B",

            targets: [
                "A",
                "B"
            ]

        },

        {
            animal: "A",

            targets: [
                "A"
            ]

        }

    ];

}


/* =====================================================
   TOTAL DURATION
===================================================== */

function totalDuration() {

    let total = 0;


    sequence.forEach(
        item => {

            /*
                Every attempt:
                movement + matching

                After the FINAL correct attempt:
                + 1 second pause
            */

            total +=
                item.targets.length *
                (
                    moveDuration +
                    matchDuration
                );

            total +=
                CORRECT_PAUSE;

        }
    );


    return total;

}


/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground() {

    ctx.fillStyle =
        "#dbeafe";

    ctx.fillRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    if (!backgroundImage) {
        return;
    }


    const scale =
        Math.max(
            WIDTH /
            backgroundImage.width,

            HEIGHT /
            backgroundImage.height
        );


    const width =
        backgroundImage.width *
        scale;


    const height =
        backgroundImage.height *
        scale;


    const x =
        (WIDTH - width) / 2;


    const y =
        (HEIGHT - height) / 2;


    ctx.save();

    ctx.globalAlpha =
        backgroundOpacity;

    ctx.drawImage(
        backgroundImage,
        x,
        y,
        width,
        height
    );

    ctx.restore();

}


/* =====================================================
   LEFT HALF
===================================================== */

function drawLeftHalf(
    img,
    target
) {

    if (!img) {
        return;
    }


    const x =
        ANIMAL_X;


    const y =
        ROWS[target] +
        ANIMAL_Y;


    ctx.save();

    ctx.beginPath();

    ctx.rect(
        x,
        y,
        HALF_WIDTH,
        ANIMAL_SIZE
    );

    ctx.clip();


    ctx.drawImage(
        img,
        x,
        y,
        ANIMAL_SIZE,
        ANIMAL_SIZE
    );


    ctx.restore();

}


/* =====================================================
   COMPLETE IMAGE
===================================================== */

function drawCompleteAnimal(
    img,
    target
) {

    if (!img) {
        return;
    }


    const x =
        ANIMAL_X;


    const y =
        ROWS[target] +
        ANIMAL_Y;


    ctx.drawImage(
        img,
        x,
        y,
        ANIMAL_SIZE,
        ANIMAL_SIZE
    );

}


/* =====================================================
   RIGHT HALF
===================================================== */

function drawRightHalf(
    img,
    x,
    y
) {

    if (!img) {
        return;
    }


    ctx.save();

    ctx.beginPath();

    ctx.rect(
        x,
        y,
        HALF_WIDTH,
        ANIMAL_SIZE
    );

    ctx.clip();


    ctx.drawImage(
        img,
        x - HALF_WIDTH,
        y,
        ANIMAL_SIZE,
        ANIMAL_SIZE
    );


    ctx.restore();

}


/* =====================================================
   SIGN
===================================================== */

function drawSign(
    target,
    correct
) {

    const x = 850;


    const y =
        ROWS[target] +
        ANIMAL_Y +
        ANIMAL_SIZE / 2;


    ctx.beginPath();

    ctx.arc(
        x,
        y,
        45,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        correct
        ? "#22c55e"
        : "#ef4444";


    ctx.fill();


    ctx.fillStyle =
        "#fff";


    ctx.font =
        "bold 58px Arial";


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillText(
        correct
        ? "✓"
        : "×",
        x,
        y
    );

}


/* =====================================================
   CREDIT
===================================================== */

function drawCredit() {

    const enabled =
        document
        .getElementById(
            "enableCredit"
        )
        .checked;


    if (!enabled) {
        return;
    }


    const text =
        document
        .getElementById(
            "creditText"
        )
        .value
        .trim();


    if (!text) {
        return;
    }


    ctx.save();

    ctx.font =
        "24px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillStyle =
        "rgba(255,255,255,.55)";


    ctx.fillText(
        text,
        WIDTH / 2,
        HEIGHT - 75
    );


    ctx.restore();

}


/* =====================================================
   EASING
===================================================== */

function ease(t) {

    if (t < 0.5) {

        return 4 *
            t *
            t *
            t;

    }

    return 1 -
        Math.pow(
            -2 * t + 2,
            3
        ) / 2;

}


/* =====================================================
   GET ANIMATION STATE
===================================================== */

function getAnimationState(
    elapsed
) {

    let time = 0;


    for (
        let animalIndex = 0;
        animalIndex < sequence.length;
        animalIndex++
    ) {

        const item =
            sequence[animalIndex];


        for (
            let targetIndex = 0;
            targetIndex <
            item.targets.length;
            targetIndex++
        ) {

            const duration =
                moveDuration +
                matchDuration;


            if (
                elapsed <
                time + duration
            ) {

                return {

                    type: "attempt",

                    animalIndex,

                    targetIndex,

                    item,

                    target:
                        item.targets[
                            targetIndex
                        ],

                    localTime:
                        elapsed - time

                };

            }


            time += duration;

        }


        /*
            NEW:
            Correct-match pause.

            During this period the final
            matched image + ✓ stays visible.
        */

        if (
            elapsed <
            time + CORRECT_PAUSE
        ) {

            return {

                type: "pause",

                animalIndex,

                item,

                target:
                    item.targets[
                        item.targets.length - 1
                    ],

                localTime:
                    elapsed - time

            };

        }


        time += CORRECT_PAUSE;

    }


    return null;

}


/* =====================================================
   RENDER FRAME
===================================================== */

function renderFrame(
    elapsed,
    playSound = false
) {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    drawBackground();


    const state =
        getAnimationState(
            elapsed
        );


    /*
        Finished
    */

    if (!state) {

        [
            "A",
            "B",
            "C",
            "D"
        ].forEach(
            letter => {

                drawCompleteAnimal(
                    animals[letter],
                    letter
                );

                drawSign(
                    letter,
                    true
                );

            }
        );


        drawCredit();

        return;

    }


    /*
        Determine already matched
        positions.
    */

    const matchedPositions = {

        A: false,
        B: false,
        C: false,
        D: false

    };


    for (
        let i = 0;
        i < state.animalIndex;
        i++
    ) {

        const completed =
            sequence[i];


        const finalTarget =
            completed.targets[
                completed.targets.length - 1
            ];


        matchedPositions[
            finalTarget
        ] = true;

    }


    /*
        During correct pause,
        current animal is already matched.
    */

    if (
        state.type === "pause"
    ) {

        matchedPositions[
            state.target
        ] = true;

    }


    /*
        Draw left side.
    */

    [
        "A",
        "B",
        "C",
        "D"
    ].forEach(
        letter => {

            if (
                matchedPositions[letter]
            ) {

                drawCompleteAnimal(
                    animals[letter],
                    letter
                );

            }
            else {

                drawLeftHalf(
                    animals[letter],
                    letter
                );

            }

        }
    );


    /*
        Permanent correct signs.
    */

    [
        "A",
        "B",
        "C",
        "D"
    ].forEach(
        letter => {

            if (
                matchedPositions[letter]
            ) {

                drawSign(
                    letter,
                    true
                );

            }

        }
    );


    /*
        Correct pause:
        Do NOT show moving image.

        Just keep the correct image
        and ✓ visible for 1 second.
    */

    if (
        state.type === "pause"
    ) {

        drawCredit();

        return;

    }


    /*
        Audio.
    */

    if (playSound) {

        handlePreviewAudio(
            state
        );

    }


    /*
        Current movement.
    */

    const localTime =
        state.localTime;


    let movementProgress;


    if (
        localTime <
        moveDuration
    ) {

        movementProgress =
            localTime /
            moveDuration;

    }
    else {

        movementProgress = 1;

    }


    movementProgress =
        ease(
            movementProgress
        );


    let startX;
    let startY;


    /*
        First attempt starts from
        top-right.
    */

    if (
        state.targetIndex === 0
    ) {

        startX =
            WIDTH;

        startY =
            TOP_SPACE;

    }
    else {

        /*
            Continue directly downward
            from the previous position.
        */

        const previousTarget =
            state.item.targets[
                state.targetIndex - 1
            ];


        startX =
            RIGHT_X;


        startY =
            ROWS[
                previousTarget
            ] +
            ANIMAL_Y;

    }


    const targetX =
        RIGHT_X;


    const targetY =
        ROWS[
            state.target
        ] +
        ANIMAL_Y;


    const currentX =
        startX +
        (
            targetX -
            startX
        ) *
        movementProgress;


    const currentY =
        startY +
        (
            targetY -
            startY
        ) *
        movementProgress;


    drawRightHalf(
        animals[
            state.item.animal
        ],
        currentX,
        currentY
    );


    /*
        Wrong / correct sign.
    */

    if (
        localTime >=
        moveDuration
    ) {

        const correct =
            state.targetIndex ===
            state.item.targets.length - 1;


        drawSign(
            state.target,
            correct
        );

    }


    drawCredit();

}


/* =====================================================
   AUDIO HANDLER
===================================================== */

function handlePreviewAudio(
    state
) {

    if (!state) {
        return;
    }


    const moving =
        state.localTime <
        moveDuration;


    const matching =
        state.localTime >=
        moveDuration;


    const key =
        state.animalIndex +
        "-" +
        state.targetIndex +
        "-" +
        (
            moving
            ? "moving"
            : "match"
        );


    if (
        key ===
        lastAudioEventKey
    ) {

        return;

    }


    lastAudioEventKey =
        key;


    if (moving) {

        playAudio(
            audioMoving
        );

    }
    else {

        const correct =
            state.targetIndex ===
            state.item.targets.length - 1;


        if (correct) {

            playAudio(
                audioCorrect
            );

        }
        else {

            playAudio(
                audioWrong
            );

        }

    }

}


/* =====================================================
   STATIC CANVAS
===================================================== */

function drawStaticCanvas() {

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    drawBackground();


    [
        "A",
        "B",
        "C",
        "D"
    ].forEach(
        letter => {

            drawLeftHalf(
                animals[letter],
                letter
            );

        }
    );


    drawCredit();

}


/* =====================================================
   VALIDATE
===================================================== */

function validateImages() {

    return !!(
        animals.A &&
        animals.B &&
        animals.C &&
        animals.D
    );

}


/* =====================================================
   GENERATE PREVIEW
===================================================== */

function generatePreview() {

    if (!validateImages()) {

        alert(
            "Please upload all four animal images."
        );

        return;

    }


    moveDuration =
        Number(
            document
            .getElementById(
                "moveDuration"
            )
            .value
        ) || 3;


    matchDuration =
        Number(
            document
            .getElementById(
                "matchDuration"
            )
            .value
        ) || 1;


    createSequence();


    document
    .getElementById(
        "totalTime"
    )
    .textContent =
        totalDuration()
        .toFixed(1) +
        "s";


    lastAudioEventKey = "";


    stopAllPreviewAudio();


    renderFrame(
        0,
        false
    );


    status.textContent =
        "Animation ready";

}


/* =====================================================
   PLAY
===================================================== */

function playPreview() {

    if (!validateImages()) {

        alert(
            "Please upload all four animal images."
        );

        return;

    }


    if (isPlaying) {
        return;
    }


    createSequence();


    isPlaying = true;


    const start =
        performance.now() -
        previewPaused * 1000;


    lastAudioEventKey = "";


    function loop(now) {

        if (!isPlaying) {
            return;
        }


        const elapsed =
            (
                now -
                start
            ) / 1000;


        const total =
            totalDuration();


        if (
            elapsed >= total
        ) {

            renderFrame(
                total,
                false
            );


            isPlaying = false;

            previewPaused = 0;


            progressBar.style.width =
                "100%";


            currentTime.textContent =
                total.toFixed(1) +
                "s";


            status.textContent =
                "Finished ✓";


            stopAllPreviewAudio();

            return;

        }


        renderFrame(
            elapsed,
            true
        );


        progressBar.style.width =
            (
                elapsed /
                total *
                100
            ) + "%";


        currentTime.textContent =
            elapsed.toFixed(1) +
            "s";


        previewAnimation =
            requestAnimationFrame(
                loop
            );

    }


    previewAnimation =
        requestAnimationFrame(
            loop
        );

}


/* =====================================================
   PAUSE
===================================================== */

function pausePreview() {

    if (!isPlaying) {
        return;
    }


    isPlaying = false;


    cancelAnimationFrame(
        previewAnimation
    );


    previewPaused =
        Number(
            currentTime
            .textContent
            .replace(
                "s",
                ""
            )
        );


    stopAllPreviewAudio();


    status.textContent =
        "Paused";

}


/* =====================================================
   RESTART
===================================================== */

function restartPreview() {

    isPlaying = false;


    cancelAnimationFrame(
        previewAnimation
    );


    previewPaused = 0;

    lastAudioEventKey = "";


    stopAllPreviewAudio();


    renderFrame(
        0,
        false
    );


    progressBar.style.width =
        "0%";


    currentTime.textContent =
        "0.0s";


    status.textContent =
        "Ready";

}


/* =====================================================
   WEBM MIME
===================================================== */

function getWebMMime() {

    const types = [

        "video/webm;codecs=vp9,opus",

        "video/webm;codecs=vp8,opus",

        "video/webm"

    ];


    for (
        const type of types
    ) {

        if (
            MediaRecorder.isTypeSupported(
                type
            )
        ) {

            return type;

        }

    }


    return null;

}


/* =====================================================
   AUDIO RECORDING STREAM
===================================================== */

function setupAudioRecording() {

    if (
        !audioMoving &&
        !audioWrong &&
        !audioCorrect
    ) {

        return null;

    }


    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    audioDestination =
        audioContext
        .createMediaStreamDestination();


    if (audioMoving) {

        movingSource =
            audioContext
            .createMediaElementSource(
                audioMoving
            );


        movingSource.connect(
            audioDestination
        );


        movingSource.connect(
            audioContext.destination
        );

    }


    if (audioWrong) {

        wrongSource =
            audioContext
            .createMediaElementSource(
                audioWrong
            );


        wrongSource.connect(
            audioDestination
        );


        wrongSource.connect(
            audioContext.destination
        );

    }


    if (audioCorrect) {

        correctSource =
            audioContext
            .createMediaElementSource(
                audioCorrect
            );


        correctSource.connect(
            audioDestination
        );


        correctSource.connect(
            audioContext.destination
        );

    }


    return audioDestination.stream;

}


/* =====================================================
   RESET RECORDING AUDIO
===================================================== */

function resetRecordingAudio() {

    [
        audioMoving,
        audioWrong,
        audioCorrect
    ].forEach(
        audio => {

            if (!audio) {
                return;
            }


            try {

                audio.pause();

                audio.currentTime = 0;

            }
            catch (error) {}

        }
    );

}


/* =====================================================
   GENERATE WEBM
===================================================== */

async function generateWebM() {

    if (!validateImages()) {

        alert(
            "Please upload all four animal images."
        );

        return;

    }


    if (
        typeof MediaRecorder ===
        "undefined"
    ) {

        alert(
            "MediaRecorder is not supported in this browser."
        );

        return;

    }


    if (
        typeof canvas.captureStream !==
        "function"
    ) {

        alert(
            "Canvas recording is not supported."
        );

        return;

    }


    moveDuration =
        Number(
            document
            .getElementById(
                "moveDuration"
            )
            .value
        ) || 3;


    matchDuration =
        Number(
            document
            .getElementById(
                "matchDuration"
            )
            .value
        ) || 1;


    createSequence();


    const mime =
        getWebMMime();


    if (!mime) {

        alert(
            "WebM is not supported by this browser."
        );

        return;

    }


    const generateButton =
        document.getElementById(
            "generateVideoBtn"
        );


    const downloadButton =
        document.getElementById(
            "downloadBtn"
        );


    generateButton.disabled =
        true;


    downloadButton.style.display =
        "none";


    status.textContent =
        "Preparing WebM...";


    resetRecordingAudio();


    renderFrame(
        0,
        false
    );


    const videoStream =
        canvas.captureStream(30);


    let audioStream = null;


    try {

        if (
            audioMoving ||
            audioWrong ||
            audioCorrect
        ) {

            audioStream =
                setupAudioRecording();

        }

    }
    catch (error) {

        console.error(
            "Audio setup error:",
            error
        );

        audioStream = null;

    }


    const combinedStream =
        new MediaStream();


    videoStream
    .getVideoTracks()
    .forEach(
        track => {

            combinedStream.addTrack(
                track
            );

        }
    );


    if (audioStream) {

        audioStream
        .getAudioTracks()
        .forEach(
            track => {

                combinedStream.addTrack(
                    track
                );

            }
        );

    }


    let recorder;


    try {

        recorder =
            new MediaRecorder(
                combinedStream,
                {

                    mimeType: mime,

                    videoBitsPerSecond:
                        8000000,

                    audioBitsPerSecond:
                        192000

                }
            );

    }
    catch (error) {

        console.error(error);

        generateButton.disabled =
            false;

        alert(
            "Could not start WebM recorder."
        );

        return;

    }


    const chunks = [];


    recorder.ondataavailable =
        event => {

            if (
                event.data &&
                event.data.size > 0
            ) {

                chunks.push(
                    event.data
                );

            }

        };


    recorder.onerror =
        event => {

            console.error(
                event
            );

            generateButton.disabled =
                false;

            status.textContent =
                "Recording error";

        };


    recorder.onstop =
        () => {

            generatedBlob =
                new Blob(
                    chunks,
                    {
                        type: mime
                    }
                );


            if (generatedUrl) {

                URL.revokeObjectURL(
                    generatedUrl
                );

            }


            generatedUrl =
                URL.createObjectURL(
                    generatedBlob
                );


            const video =
                document.getElementById(
                    "generatedVideo"
                );


            video.src =
                generatedUrl;


            video.load();


            document
            .getElementById(
                "videoResult"
            )
            .style.display =
                "block";


            downloadButton.style.display =
                "block";


            generateButton.disabled =
                false;


            status.textContent =
                "WebM generated successfully ✓";


            combinedStream
            .getTracks()
            .forEach(
                track => {

                    try {
                        track.stop();
                    }
                    catch (e) {}

                }
            );


            if (audioContext) {

                audioContext
                .close()
                .catch(
                    () => {}
                );

                audioContext = null;

            }

        };


    recorder.start(1000);


    const total =
        totalDuration();


    const startTime =
        performance.now();


    const FPS = 30;

    const frameInterval =
        1000 / FPS;


    let stopped = false;

    let timer = null;

    let recordingAudioEvent = "";


    /*
        Recording audio events.
    */

    function processRecordingAudio(
        elapsed
    ) {

        const state =
            getAnimationState(
                elapsed
            );


        /*
            No audio during the
            final 1-second correct pause.
        */

        if (
            !state ||
            state.type === "pause"
        ) {

            return;

        }


        const moving =
            state.localTime <
            moveDuration;


        const eventKey =
            state.animalIndex +
            "-" +
            state.targetIndex +
            "-" +
            (
                moving
                ? "moving"
                : "match"
            );


        if (
            eventKey ===
            recordingAudioEvent
        ) {

            return;

        }


        recordingAudioEvent =
            eventKey;


        if (moving) {

            playAudio(
                audioMoving
            );

        }
        else {

            const correct =
                state.targetIndex ===
                state.item.targets.length - 1;


            if (correct) {

                playAudio(
                    audioCorrect
                );

            }
            else {

                playAudio(
                    audioWrong
                );

            }

        }

    }


    function renderRecordingFrame() {

        if (stopped) {
            return;
        }


        const elapsed =
            (
                performance.now() -
                startTime
            ) / 1000;


        if (
            elapsed >= total
        ) {

            stopped = true;


            renderFrame(
                total,
                false
            );


            progressBar.style.width =
                "100%";


            currentTime.textContent =
                total.toFixed(1) +
                "s";


            clearInterval(timer);


            status.textContent =
                "Finishing WebM...";


            setTimeout(
                () => {

                    if (
                        recorder.state ===
                        "recording"
                    ) {

                        recorder.stop();

                    }

                },
                700
            );


            return;

        }


        renderFrame(
            elapsed,
            false
        );


        processRecordingAudio(
            elapsed
        );


        const percent =
            (
                elapsed /
                total
            ) * 100;


        progressBar.style.width =
            percent + "%";


        currentTime.textContent =
            elapsed.toFixed(1) +
            "s";


        status.textContent =
            "Generating WebM " +
            Math.floor(percent) +
            "%";

    }


    renderRecordingFrame();


    timer =
        setInterval(
            renderRecordingFrame,
            frameInterval
        );

}


/* =====================================================
   DOWNLOAD
===================================================== */

function downloadWebM() {

    if (!generatedBlob) {

        alert(
            "Generate the video first."
        );

        return;

    }


    const url =
        URL.createObjectURL(
            generatedBlob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href = url;


    link.download =
        "animal-match-short-" +
        Date.now() +
        ".webm";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(
        () => {

            URL.revokeObjectURL(
                url
            );

        },
        1000
    );

}

   BUTTONS
===================================================== */

document
.getElementById(
    "generatePreviewBtn"
)
.addEventListener(
    "click",

);


document
.getElementById(

)

document

)

document
.getElementById(

document

)

/* =====================================================
   INITIALIZE
===================================================== */

createSequence();

drawStaticCanvas();


document
.getElementById(
    "totalTime"
)
.textContent =
    totalDuration()
    .toFixed(1) +
    "s";

</script>
